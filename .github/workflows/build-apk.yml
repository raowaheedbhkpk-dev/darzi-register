name: APK banao

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android project tayyar karo
        run: |
          mkdir -p build/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png maskable-512.png build/www/
          cd build
          cat > package.json <<'EOF'
          {"name":"darzi-register","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/core":"^6.0.0","@capacitor/cli":"^6.0.0","@capacitor/android":"^6.0.0",
           "@capacitor/app":"^6.0.0","@capacitor/share":"^6.0.0","@capacitor/filesystem":"^6.0.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.darziregister.app","appName":"Darzi Register","webDir":"www","android":{"backgroundColor":"#a3172f"}}
          EOF
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: App icon aur version lagao
        run: |
          RES=build/android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp launcher-$d.png $RES/mipmap-$d/ic_launcher.png
            cp launcher-$d.png $RES/mipmap-$d/ic_launcher_round.png
          done
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build/android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" build/android/app/build.gradle

      - name: APK build karo
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK sign karo
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "KEYSTORE_B64 secret nahi mila. README dekhein."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=build/android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --ks-key-alias darzi --out Darzi-Register.apk aligned.apk
          rm -f release.keystore
          $BT/apksigner verify Darzi-Register.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Darzi-Register-APK
          path: Darzi-Register.apk

      - name: Release mein APK daalo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Darzi Register v1.${{ github.run_number }}
          files: Darzi-Register.apk
