name: Flutter APK banao

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android project banao
        run: |
          flutter create --platforms=android --org com.darziregister --project-name darzi_register .
          flutter pub get

      - name: Code check karo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: App naam aur icon lagao
        run: |
          sed -i 's/android:label="darzi_register"/android:label="Darzi Register"/' android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp launcher-$d.png $RES/mipmap-$d/ic_launcher.png
          done

      - name: APK build karo
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: APK sign karo
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "KEYSTORE_B64 secret nahi mila."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks release.keystore --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --ks-key-alias darzi \
            --out Darzi-Register.apk build/app/outputs/flutter-apk/app-release.apk
          $BT/apksigner verify Darzi-Register.apk
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: Darzi-Register-APK
          path: Darzi-Register.apk

      - name: Release mein APK daalo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Darzi Register v1.0.${{ github.run_number }}
          files: Darzi-Register.apk
