<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Darzi Register</title>
<meta name="theme-color" content="#a3172f">
<meta name="description" content="Tailor shop ka naap, orders aur hisaab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@500;700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky top bar + fixed bottom tab bar; measurement slips mimic the red-bordered register page */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ed; --fg:#1d2430; --muted:#5d6878; --line:#d3d9e1;
  --accent:#a3172f; --accent-ink:#ffffff; --accent-soft:#f6e3e6;
  --ok:#1d7a4c; --ok-soft:#dcf1e5; --warn:#a56200; --warn-soft:#fbecd2; --bad:#b4232c; --bad-soft:#fbe0e1; --info:#2a5ea8; --info-soft:#e0eaf8;
  --f-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1b2129; --sunk:#232a34; --fg:#e6eaf0; --muted:#9aa5b4; --line:#323b47;
  --accent:#e0566c; --accent-ink:#1a0a0d; --accent-soft:#3a1e24;
  --ok:#5cc98f; --ok-soft:#173326; --warn:#f0b04e; --warn-soft:#3a2c14; --bad:#f07a80; --bad-soft:#3c1c1f; --info:#7fb0f5; --info-soft:#1a2a40;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1b2129; --sunk:#232a34; --fg:#e6eaf0; --muted:#9aa5b4; --line:#323b47;
  --accent:#e0566c; --accent-ink:#1a0a0d; --accent-soft:#3a1e24;
  --ok:#5cc98f; --ok-soft:#173326; --warn:#f0b04e; --warn-soft:#3a2c14; --bad:#f07a80; --bad-soft:#3c1c1f; --info:#7fb0f5; --info-soft:#1a2a40;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ur{font-family:var(--f-ur);direction:rtl;line-height:1.9}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{background:none;border:0;color:inherit;font-size:22px;line-height:1;padding:4px 6px;margin-left:-6px}
.top .sync{font-size:11px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}

main{max-width:720px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat b{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--bad)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:baseline}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .sn{font-family:var(--f-num);font-size:12px;color:var(--muted);min-width:34px}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .main b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{color:var(--muted);font-size:13px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-new{background:var(--info-soft);color:var(--info)}
.st-cutting{background:var(--warn-soft);color:var(--warn)}
.st-silai{background:var(--accent-soft);color:var(--accent)}
.st-ready{background:var(--ok-soft);color:var(--ok)}
.st-done{background:var(--sunk);color:var(--muted)}
.late{background:var(--bad-soft);color:var(--bad)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 140px}

/* Register slip */
.slip{background:var(--surface);border:2px solid var(--accent);border-radius:6px;padding:14px;position:relative;
  box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5px var(--accent-soft)}
.slip-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:6px}
.slip-head h3{margin:0;font-size:20px;font-weight:800;line-height:1.25}
.slip-head .meta{color:var(--muted);font-size:13px}
.serial{font-family:var(--f-num);font-weight:700;color:var(--accent);font-size:13px;border:1px solid var(--accent);border-radius:4px;padding:2px 7px;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));column-gap:18px}
.mitem{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px dotted var(--line)}
.mitem .lbl{display:flex;flex-direction:column;line-height:1.1}
.mitem .lbl .ur{font-size:15px;line-height:1.7}
.mitem .lbl small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mitem .v{font-family:var(--f-num);font-weight:700;font-size:17px}
.mitem .v.blank{color:var(--line)}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.box{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.box .t{background:var(--accent);color:var(--accent-ink);width:100%;text-align:center;font-size:12px;font-weight:700;padding:3px 2px}
.box .t .ur{font-size:13px;line-height:1.6}
.box .v{font-family:var(--f-num);font-weight:700;font-size:17px;padding:6px 2px}
.notes{margin-top:12px;background:var(--sunk);border-radius:6px;padding:10px 12px;white-space:pre-wrap;font-size:14px}
.notes b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}

/* Forms */
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:0 6px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.f label .ur{font-size:14px;color:var(--fg);line-height:1.6}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.f input.m{font-family:var(--f-num);font-weight:700;font-size:17px;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fracbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--fg);color:var(--bg);display:flex;gap:6px;justify-content:center;align-items:center;
  padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fracbar span{font-size:12px;opacity:.75;margin-right:4px}
.fracbar button{background:var(--bg);color:var(--fg);border:0;border-radius:6px;font-family:var(--f-num);font-weight:700;font-size:18px;min-width:46px;padding:6px 8px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.money div{background:var(--sunk);border-radius:8px;padding:8px 4px}
.money b{display:block;font-family:var(--f-num);font-size:17px}
.money small{color:var(--muted);font-size:12px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:90vw}
.hint{color:var(--muted);font-size:13px;margin:0}
.banner.good{background:var(--ok-soft);color:var(--ok)}
.banner button{margin-top:8px}
.drive-card{display:flex;flex-direction:column;gap:10px}
.drive-status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.row,.btn,.stat{transition:background .15s,transform .1s}.btn:active{transform:scale(.98)}}
</style>
</head>
<body>

<header class="top">
  <button class="back" id="backBtn" aria-label="Wapas" hidden>‹</button>
  <h1 id="title">Darzi Register</h1>
  <span class="sync" id="sync">…</span>
</header>
<main id="main"><div class="empty">Data load ho raha hai…</div></main>
<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"/></svg>Customers</button>
  <button data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5L20 19M8.5 15.5L20 5"/></svg>Settings</button>
</nav>
<div class="fracbar" id="fracbar" hidden><span>Jorein:</span><button data-f="¼">¼</button><button data-f="½">½</button><button data-f="¾">¾</button><button data-f="⌫" aria-label="Mitaein">⌫</button></div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- Field definitions (same order as the register) ----------
const MEAS = [
  {k:"qameez", ur:"قمیض", en:"Qameez"},
  {k:"shirt", ur:"شرٹ", en:"Shirt"},
  {k:"waistcoat", ur:"ویس کوٹ", en:"Waistcoat"},
  {k:"bazoo", ur:"بازو", en:"Bazoo"},
  {k:"teera", ur:"تیرا", en:"Teera"},
  {k:"gala", ur:"گلہ", en:"Gala"},
  {k:"chhati", ur:"چھاتی", en:"Chhati"},
  {k:"kamar", ur:"کمر", en:"Kamar"},
  {k:"ghera", ur:"گھیرا", en:"Ghera"},
  {k:"pockets", ur:"پاکٹس", en:"Pockets"},
  {k:"shalwar", ur:"شلوار", en:"Shalwar"},
  {k:"paincha", ur:"پائنچہ", en:"Paincha"},
];
const BOXES = [
  {k:"front", ur:"فرنٹ", en:"Front"},
  {k:"side", ur:"سائیڈ", en:"Side"},
  {k:"hip", ur:"ہپ", en:"Hip"},
  {k:"collar", ur:"کالر/بین", en:"Collar"},
  {k:"cuff", ur:"کف", en:"Cuff"},
  {k:"plate", ur:"پلیٹ", en:"Plate"},
];
const STATUSES = [
  {k:"new", en:"Naya", ur:"نیا"},
  {k:"cutting", en:"Cutting", ur:"کٹنگ"},
  {k:"silai", en:"Silai", ur:"سلائی"},
  {k:"ready", en:"Tayyar", ur:"تیار"},
  {k:"done", en:"Delivered", ur:"دے دیا"},
];
const stInfo = k => STATUSES.find(s=>s.k===k) || STATUSES[0];
const GHERA = ["Gol","Seedha"];
const COLLAR = ["Collar","Bain","Sherwani"];

// ---------- Data layer: saved on this phone, backed up to Google Drive ----------
// Optional: put your Google OAuth Client ID here for automatic Drive backup (README dekhein).
const GOOGLE_CLIENT_ID = "";
const DRIVE_FILE = "Darzi-Register-Backup.json";
// Running inside the Android APK (Capacitor)?
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const plug = n => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[n]) || null;

const S = {customers:[], orders:[], shop:{name:"", phone:""}, ready:false, mode:"Offline ready",
  meta:{lastBackup:0, changes:0, driveFileId:"", driveEmail:""}};
const LS = "darziRegister.v1";
function lsLoad(){ try{ const d=JSON.parse(localStorage.getItem(LS)||"null"); if(d){S.customers=d.customers||[];S.orders=d.orders||[];S.shop=d.shop||S.shop;S.meta={...S.meta,...(d.meta||{})};} }catch(e){} }
function lsSave(){
  try{ localStorage.setItem(LS, JSON.stringify({customers:S.customers,orders:S.orders,shop:S.shop,meta:S.meta})); }
  catch(e){ toast("Phone ki memory bhar gayi, backup le kar purane orders delete karein"); }
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function changed(){ S.meta.changes=(S.meta.changes||0)+1; lsSave(); scheduleAutoBackup(); }

async function put(col, obj){
  const arr = S[col]; const i = arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
  changed();
}
async function del(col, id){ S[col] = S[col].filter(x=>x.id!==id); changed(); }
async function saveShop(){ changed(); }

function backupJSON(){
  return JSON.stringify({app:"darzi-register",v:1,at:new Date().toISOString(),shop:S.shop,customers:S.customers,orders:S.orders});
}
function markBackedUp(){ S.meta.lastBackup=Date.now(); S.meta.changes=0; lsSave(); }

// Method 1 (no setup): Android share sheet -> "Drive" -> Save
async function shareBackup(){
  const name = `darzi-backup-${iso(new Date())}.json`;
  if(NATIVE && plug("Filesystem") && plug("Share")){
    try{
      const w = await plug("Filesystem").writeFile({path:name, data:backupJSON(), directory:"CACHE", encoding:"utf8"});
      try{ await plug("Share").share({title:"Darzi Register backup", files:[w.uri], dialogTitle:"Drive chunein aur Save karein"}); }
      catch(e){ if(/cancel/i.test(e.message||"")) return; await plug("Share").share({title:"Darzi Register backup", url:w.uri, dialogTitle:"Drive chunein aur Save karein"}); }
      markBackedUp(); toast("Backup bhej diya"); render();
    }catch(e){ if(!/cancel/i.test(e.message||"")) toast("Backup nahi hua: "+(e.message||e)); }
    return;
  }
  const file = new File([backupJSON()], name, {type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"Darzi Register backup"}); markBackedUp(); toast("Backup bhej diya"); render(); return; }
    catch(e){ if(e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  markBackedUp(); toast("Backup file Downloads mein save ho gayi"); render();
}

function mergeBackup(d){
  if(!d || !Array.isArray(d.customers)) throw new Error("bad");
  const up=(col,list)=>{ for(const x of list||[]){ if(!x||!x.id) continue; const i=S[col].findIndex(y=>y.id===x.id); if(i>=0) S[col][i]=x; else S[col].push(x); } };
  up("customers", d.customers); up("orders", d.orders);
  if(d.shop && !S.shop.name) S.shop=d.shop;
  lsSave();
  return d.customers.length;
}

// Method 2 (optional, automatic): Google Drive API with the app's own file
let gToken=null, gTokenExp=0, tokenClient=null, autoTimer=null;
const driveOn = () => !!GOOGLE_CLIENT_ID && !NATIVE; // Google sign-in does not work inside the APK
function loadGIS(){ return new Promise((res,rej)=>{ if(window.google?.accounts?.oauth2) return res();
  const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.onload=res; s.onerror=()=>rej(new Error("Internet nahi")); document.head.appendChild(s); }); }
async function getToken(interactive){
  if(gToken && Date.now()<gTokenExp-60000) return gToken;
  if(!interactive) return null;
  await loadGIS();
  return new Promise((res,rej)=>{
    tokenClient = google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID, scope:"https://www.googleapis.com/auth/drive.file",
      callback:r=>{ if(r.error) return rej(new Error(r.error)); gToken=r.access_token; gTokenExp=Date.now()+(r.expires_in||3600)*1000; S.meta.driveLinked=true; lsSave(); res(gToken); }});
    tokenClient.requestAccessToken({prompt: S.meta.driveLinked ? "" : "consent"});
  });
}
async function driveFind(token){
  const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,modifiedTime)`,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) throw new Error("Drive "+r.status);
  return (await r.json()).files?.[0]?.id || "";
}
async function driveUpload(interactive){
  const token=await getToken(interactive); if(!token) return false;
  const body=backupJSON();
  let id=S.meta.driveFileId || await driveFind(token);
  let r;
  if(id){
    r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:"PATCH",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body});
    if(r.status===404){ id=""; }
  }
  if(!id){
    const fd=new FormData();
    fd.append("metadata",new Blob([JSON.stringify({name:DRIVE_FILE,mimeType:"application/json"})],{type:"application/json"}));
    fd.append("file",new Blob([body],{type:"application/json"}));
    r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});
    if(r.ok) id=(await r.json()).id;
  }
  if(!r.ok) throw new Error("Drive "+r.status);
  S.meta.driveFileId=id; markBackedUp(); return true;
}
async function driveRestore(){
  const token=await getToken(true);
  const id=S.meta.driveFileId || await driveFind(token);
  if(!id) throw new Error("Drive par koi backup nahi mila");
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) throw new Error("Drive "+r.status);
  S.meta.driveFileId=id; return mergeBackup(await r.json());
}
function scheduleAutoBackup(){
  if(!driveOn() || !gToken || !navigator.onLine) return;
  clearTimeout(autoTimer);
  autoTimer=setTimeout(async()=>{ try{ if(await driveUpload(false)) setSync(); }catch(e){} }, 15000);
}

function agoText(t){ const m=Math.round((Date.now()-t)/60000); if(m<1) return "abhi"; if(m<60) return m+" min"; const h=Math.round(m/60); if(h<24) return h+" ghante"; return Math.round(h/24)+" din"; }

async function init(){

  S.ready = true; render(); setSync();

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs = n => "Rs " + (Math.round(Number(n)||0)).toLocaleString("en-PK");
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => { const z=new Date(d); z.setMinutes(z.getMinutes()-z.getTimezoneOffset()); return z.toISOString().slice(0,10); };
const daysFrom = s => s ? Math.round((new Date(s+"T00:00:00") - today())/86400000) : null;
const fmtDate = s => s ? new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "—";
const custById = id => S.customers.find(c=>c.id===id);
const due = o => Math.max(0,(Number(o.price)||0)-(Number(o.advance)||0));
const isLate = o => o.status!=="done" && o.status!=="ready" && daysFrom(o.delivery)!==null && daysFrom(o.delivery)<0;
const nextSerial = () => S.customers.reduce((m,c)=>Math.max(m,Number(c.serial)||0),0)+1;
function waNumber(p){ let d=String(p||"").replace(/\D/g,""); if(d.startsWith("0")) d="92"+d.slice(1); if(d.length===10&&d.startsWith("3")) d="92"+d; return d; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Copy ho gaya"); }catch(e){ toast("Copy nahi hua, text select kar lein"); } }
function dueLabel(o){
  if(o.status==="done") return `<span class="pill st-done">Delivered</span>`;
  const n=daysFrom(o.delivery); if(n===null) return "";
  if(n<0) return `<span class="pill late">${-n} din late</span>`;
  if(n===0) return `<span class="pill st-cutting">Aaj</span>`;
  if(n===1) return `<span class="pill st-new">Kal</span>`;
  return `<span class="hint">${fmtDate(o.delivery)}</span>`;
}

        <div class="f"><label for="delivery">Delivery date</label><input id="delivery" name="delivery" type="date" value="${esc(o?.delivery||iso(def))}"></div>
      </div>
      <div class="f"><label>Kapra / kism</label>${segHTML("type",["Shalwar Qameez","Kurta","Waistcoat","Pant Shirt","Sherwani"],o?.type)}<input type="hidden" name="type" value="${esc(o?.type||"")}"></div>
      <div class="f"><label>Status</label>${segHTML("status",STATUSES.map(s=>s.en),stInfo(o?.status||"new").en)}<input type="hidden" name="status" value="${stInfo(o?.status||"new").en}"></div>
      <div class="f"><label for="onotes">Is order ki tafseel</label><textarea id="onotes" name="onotes" placeholder="maslan: kapra customer ka, 2 jori butt…">${esc(o?.notes||"")}</textarea></div>
    </fieldset>
    <fieldset><legend>Paisay</legend>
      <div class="fgrid">
        <div class="f"><label for="price">Kul silai (Rs)</label><input id="price" name="price" type="number" min="0" inputmode="numeric" class="num" value="${esc(o?.price??"")}"></div>
        <div class="f"><label for="advance">Advance / mila (Rs)</label><input id="advance" name="advance" type="number" min="0" inputmode="numeric" class="num" value="${esc(o?.advance??"")}"></div>
      </div>
      <div class="money" id="money"></div>
      ${o&&due(o)>0?`<button type="button" class="btn small ok" id="paid">Poori payment mil gayi</button>`:""}
    </fieldset>
    <div class="actions"><button class="btn primary" type="submit">${o?"Save karein":"Order save karein"}</button></div>
    ${o?`<div class="actions"><button class="btn danger" type="button" id="delO">Order delete karein</button></div>`:""}
  </form>`;
  bindSeg(m);
  const f=$("#of");
  const money=()=>{ const p=Number(f.price.value)||0, a=Number(f.advance.value)||0;
    $("#money").innerHTML=`<div><b>${rs(p)}</b><small>Kul</small></div><div><b>${rs(a)}</b><small>Mila</small></div><div><b style="color:var(${p-a>0?"--bad":"--ok"})">${rs(Math.max(0,p-a))}</b><small>Baqaya</small></div>`; };
  f.price.oninput=f.advance.oninput=money; money();
  const sc=$("#seeC"); if(sc) sc.onclick=()=>go({name:"customer", id:cid});
  const collect = () => { const fd=new FormData(f); const cust=custById(fd.get("cust"));
    const stEn=fd.get("status"); const st=(STATUSES.find(s=>s.en===stEn)||STATUSES[0]).k;
    return {cust, data:{id:o?.id||uid(), customerId:cust?.id, customerName:cust?.name, suits:Number(fd.get("suits"))||1, delivery:fd.get("delivery")||"", type:fd.get("type")||"", status:st,
      notes:(fd.get("onotes")||"").trim(), price:Number(fd.get("price"))||0, advance:Number(fd.get("advance"))||0, createdAt:o?.createdAt||Date.now(),
      deliveredAt: st==="done" ? (o?.deliveredAt||Date.now()) : null}}; };
  f.onsubmit=async e=>{ e.preventDefault(); const {cust,data}=collect();
    if(!cust){ toast("Pehle customer chunein"); $("#cust").focus(); return; }
    await put("orders", data); toast("Order save ho gaya"); back(); };
  const adv=$("#adv"); if(adv) adv.onclick=async()=>{ const i=STATUSES.findIndex(s=>s.k===o.status); const nk=STATUSES[Math.min(i+1,STATUSES.length-1)].k;
    await put("orders",{...o, status:nk, deliveredAt: nk==="done"?Date.now():null}); toast(stInfo(nk).en+" ho gaya"); render(); };
  const pd=$("#paid"); if(pd) pd.onclick=async()=>{ await put("orders",{...o, advance:o.price}); toast("Payment poori"); render(); };
  const dO=$("#delO"); if(dO){ let armed=false; dO.onclick=async()=>{ if(!armed){armed=true; dO.textContent="Pakka? Dobara dabayein"; setTimeout(()=>{armed=false;dO.textContent="Order delete karein";},3000); return;}
    await del("orders",o.id); toast("Order delete ho gaya"); back(); }; }
}
function readyMsg(o,c){
  const d=due(o);
  return `Assalam o Alaikum ${c.name} sahib,\nAap ke ${o.suits||1} suit tayyar hain${S.shop.name?" — "+S.shop.name:""}.${d>0?`\nBaqaya raqam: ${rs(d)}`:""}\nShukriya!`;
}

// ---------- Settings ----------
function vSettings(m){
  setTitle("Settings");
  const totalEarned = S.orders.reduce((s,o)=>s+(Number(o.advance)||0),0);
  const monthKey = iso(new Date()).slice(0,7);
  const monthOrders = S.orders.filter(o=>o.createdAt && iso(new Date(o.createdAt)).slice(0,7)===monthKey);
  m.innerHTML = `
    <section class="sec"><h2>Is mahine</h2>
      <div class="stats">
        <div class="stat"><b>${monthOrders.length}</b><span>Naye orders</span></div>
        <div class="stat"><b>${monthOrders.reduce((s,o)=>s+(Number(o.suits)||1),0)}</b><span>Suits</span></div>
        <div class="stat"><b style="font-size:19px">${rs(monthOrders.reduce((s,o)=>s+(Number(o.price)||0),0))}</b><span>Kul silai</span></div>
        <div class="stat"><b>${S.customers.length}</b><span>Kul customers</span></div>
      </div>
    </section>
    <form id="sf"><fieldset><legend>Dukaan</legend>
      <div class="f"><label for="sname">Dukaan ka naam</label><input id="sname" value="${esc(S.shop.name||"")}" placeholder="maslan: Bilal Tailors"></div>
      <div class="f"><label for="sphone">Dukaan ka phone</label><input id="sphone" type="tel" class="num" value="${esc(S.shop.phone||"")}"></div>
      <button class="btn primary" type="submit">Save karein</button>
      <p class="hint">Dukaan ka naam WhatsApp messages aur naap slip par aata hai.</p>
    </fieldset></form>
    <fieldset class="drive-card"><legend>Google Drive backup</legend>
      <div class="drive-status"><span class="dot ${S.meta.lastBackup?"on":""}"></span>${S.meta.lastBackup?`Aakhri backup: ${agoText(S.meta.lastBackup)} pehle`:"Abhi tak backup nahi liya"}</div>
      ${driveOn()
        ? `<p class="hint">${gToken?"Drive juri hui hai. Har tabdeeli ke 15 second baad backup khud chala jata hai.":"Drive se jorein, phir har tabdeeli ka backup khud Drive par chala jayega."}</p>
           <div class="actions"><button class="btn primary" id="dUp" type="button">${gToken?"Abhi Drive par backup":"Google Drive se jorein"}</button>
           <button class="btn" id="dDown" type="button">Drive se data wapas laein</button></div>`
        : `<p class="hint">"Drive par backup" dabayein, phir share list mein <b>Drive</b> chunein aur <b>Save</b> dabayein. Hafte mein ek dafa zaroor karein.</p>
           <div class="actions"><button class="btn primary" id="dUp" type="button">Drive par backup</button></div>`}
      <div class="actions"><label class="btn" for="rf">Backup file se wapas laein</label><input type="file" id="rf" accept="application/json,.json" hidden></div>
      <p class="hint">Naye phone par: app install karein, phir "Backup file se wapas laein" dabayein aur Drive se apni backup file chunein.</p>
      <p class="hint num">${S.customers.length} customers · ${S.orders.length} orders · kul mila ${rs(totalEarned)}</p>
    </fieldset>
    ${installEvt?`<button class="btn ok" id="inst" type="button">Phone par install karein</button>`:""}`;
  $("#sf").onsubmit=async e=>{ e.preventDefault(); S.shop={name:$("#sname").value.trim(), phone:$("#sphone").value.trim()}; await saveShop(); toast("Save ho gaya"); render(); };
  $("#dUp").onclick=()=>doBackup();
  const dd=$("#dDown"); if(dd) dd.onclick=async()=>{ try{ const n=await driveRestore(); toast(`${n} customers Drive se aa gaye`); render(); }catch(e){ toast(e.message==="bad"?"Drive wali file sahi nahi":e.message); } };
  const ins=$("#inst"); if(ins) ins.onclick=async()=>{ installEvt.prompt(); await installEvt.userChoice; installEvt=null; render(); };
  $("#rf").onchange=async e=>{ const file=e.target.files[0]; if(!file) return;
    try{ const n=mergeBackup(JSON.parse(await file.text())); toast(`${n} customers wapas aa gaye`); render(); }
    catch(err){ toast("Ye file sahi backup nahi hai"); } };
}

function needsBackup(){
  if(!S.customers.length) return false;
  if(!S.meta.lastBackup) return true;
  return S.meta.changes>0 && (Date.now()-S.meta.lastBackup > 3*86400000 || S.meta.changes>=15);
}
async function doBackup(){
  if(driveOn()){
    try{ toast("Drive par backup ho raha hai…"); await driveUpload(true); toast("Drive par backup ho gaya"); setSync(); render(); }
    catch(e){ toast("Drive backup nahi hua: "+e.message+". File wala tareeqa istemal karein."); shareBackup(); }
  } else shareBackup();
}

init();
</script>
</body>
</html>
